services:
  # ─── Postgres for Keycloak ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hmeet-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hmeet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Postgres for Users Service ──────────────────────────────────────────────
  users-db:
    image: postgres:16-alpine
    container_name: hmeet-users-db
    environment:
      POSTGRES_DB: hmeet_users
      POSTGRES_USER: hmeet_users
      POSTGRES_PASSWORD: hmeet_users_password
    ports:
      - "5433:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
    networks:
      - hmeet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmeet_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Postgres for matches Service ───────────────────────────────────────────────
  matches-db:
    image: postgres:16-alpine
    container_name: hmeet-matches-db
    environment:
      POSTGRES_DB: hmeet_matches
      POSTGRES_USER: hmeet_matches
      POSTGRES_PASSWORD: hmeet_matches_password
    ports:
      - "5436:5432"
    volumes:
      - matches_db_data:/var/lib/postgresql/data
    networks:
      - hmeet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmeet_matches"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Postgres for Chat Service ───────────────────────────────────────────────
  chat-db:
    image: postgres:16-alpine
    container_name: hmeet-chat-db
    environment:
      POSTGRES_DB: hmeet_chat
      POSTGRES_USER: hmeet_chat
      POSTGRES_PASSWORD: hmeet_chat_password
    ports:
      - "5434:5432"
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    networks:
      - hmeet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmeet_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Postgres for Media Service ──────────────────────────────────────────────
  media-db:
    image: postgres:16-alpine
    container_name: hmeet-media-db
    environment:
      POSTGRES_DB: hmeet_media
      POSTGRES_USER: hmeet_media
      POSTGRES_PASSWORD: hmeet_media_password
    ports:
      - "5435:5432"
    volumes:
      - media_db_data:/var/lib/postgresql/data
    networks:
      - hmeet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmeet_media"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Keycloak ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.1
    container_name: hmeet-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/hmeet-realm.json:/opt/keycloak/data/import/hmeet-realm.json:ro
      # A custom theme jar used to be mounted here. Do not re-add it as a
      # bind mount unless the jar is actually built: when the source path is
      # missing Docker creates it as a *directory*, and Keycloak then dies with
      # "providers/...jar (Is a directory)" because Quarkus opens every entry
      # in providers/ as a jar. Ship a theme in a custom image instead.
      - ./dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/keycloak-theme-for-kc-all-other-versions.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hmeet-network
    healthcheck:
      # Keycloak 25+ moved the health endpoints off the HTTP port and onto the
      # management port (9000). Probing 8080 returns 404, so this probe failed
      # forever and left the container permanently unhealthy. The image has no
      # curl/wget/nc, hence the bash /dev/tcp request.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e \"GET /health/ready HTTP/1.1\r\nhost: 127.0.0.1:9000\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Zookeeper (required by Kafka) ───────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hmeet-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hmeet-network
    healthcheck:
      # ZooKeeper 3.5.3+ disables 4-letter commands except `srvr`, so the usual
      # `echo ruok | nc` probe answers "ruok is not executed because it is not in
      # the whitelist" and the container is marked unhealthy, blocking kafka.
      # The whitelist cannot be re-enabled by env var either: cp-zookeeper
      # renders a static zookeeper.properties.template. `srvr` is allowed by
      # default and reports real server state, so probe with that instead.
      test: ["CMD-SHELL", "echo srvr | nc 127.0.0.1 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hmeet-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"  # External (host machine)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - hmeet-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Kafka UI (optional, handy for dev) ──────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hmeet-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hmeet
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - hmeet-network

  # ─── RustFS (S3-compatible object storage for local development) ──────────────
  object-storage:
    image: rustfs/rustfs:latest
    container_name: hmeet-object-storage
    command: /data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - object_storage_data:/data
    networks:
      - hmeet-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  users_db_data:
    driver: local
  chat_db_data:
    driver: local
  matches_db_data:
    driver: local
  media_db_data:
    driver: local
  object_storage_data:
    driver: local

networks:
  hmeet-network:
    driver: bridge
